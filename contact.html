<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    
    <!-- Background Video -->
    <video autoplay muted loop playsinline class="bg-video">
        <source src="images/gk.mp4" type="video/mp4">
        <!-- Fall back message if video doesn't load. -->
         Your browser does not support the video tag.
    </video>

    <!-- Overlay so text stays readable -->
     <div class="bg-overlay"></div>

    <nav class="navbar">
        <div class="logo">Hillary K Harry</div>
        <button class="menu-btn" id="menuBtn">&#9776;</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="assignments.html">Assignments</a></li>
            <li><a href="contact.html" class="current">Contact</a></li>
        </ul>
    </nav>

    <main>
        <h1>Contact Me</h1>
        <p class="page-intro">Fill in the form below and I will get back to you.</p>

        <form id="contactForm" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="fullName" placeholder="Your full name">
                <span class="error" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" placeholder="yourname@email.com">
                <span class="error" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="msg">Message *</label>
                <textarea id="msg" name="msg" rows="5" placeholder="Write your message here..."></textarea>
                <span class="error" id="msgError"></span>
            </div>

            <button type="submit" class="btn">Send Message</button>
            <p id="successMsg" class="success"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Hillary K Harry. Web Development Assignment.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
